# ThreadSanitizer (PLAN.md B5): the fork's fp3d tests built with -fsanitize=thread. The sim test runs CDDA's
# game thread against a client thread through fp3d::bridge, like the Godot bridge does. Weekly and by hand:
# a cold TSan build of CDDA takes a while. Same as `TSAN=1 bash tools/build/ci_linux.sh` on Linux or WSL.
name: ThreadSanitizer
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: tsan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsan:
    name: Fork tests under TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TSAN: '1'
      TEST_TIMEOUT: '5400'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ninja-build pkg-config ccache \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libfreetype-dev zlib1g-dev libbz2-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-tsan-${{ github.sha }}
          restore-keys: ccache-tsan-
      - name: Build
        run: bash tools/build/ci_linux.sh build && ccache -s
      - name: Fork tests under TSan
        run: bash tools/build/ci_linux.sh fork-tests
